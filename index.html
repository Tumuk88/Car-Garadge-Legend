<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto Garage Legend</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #08080e; --panel-bg: rgba(16, 16, 26, 0.85); --card-bg: rgba(255, 255, 255, 0.03);
            --text: #ffffff; --text-muted: #8a8a9e; --border: rgba(255, 255, 255, 0.08);
            --success: #00ff88; --danger: #ef4444; --accent: #00e5ff;
            --c-common: #9ca3af; --c-rare: #3b82f6; --c-epic: #a855f7;
            --c-mythic: #ef4444; --c-legendary: #fbbf24; --c-special: #ff00ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
            background-image: radial-gradient(circle at 10% 10%, rgba(168,85,247,0.08), transparent 40%),
                              radial-gradient(circle at 90% 90%, rgba(59,130,246,0.08), transparent 40%); }
        #app { display: flex; flex-direction: column; height: 100vh; max-width: 480px; margin: 0 auto; position: relative; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px;
            background: var(--panel-bg); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); z-index: 10; }
        .user-info { display: flex; align-items: center; gap: 8px; }
        .user-name { font-weight: 700; font-size: 14px; }
        .level-badge { background: #ff00aa; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .balance { background: linear-gradient(135deg, #6d28d9, #3b82f6); padding: 8px 18px; border-radius: 30px;
            font-weight: 700; font-size: 15px; box-shadow: 0 4px 15px rgba(109,40,217,0.4); }
        main { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 120px; }
        main::-webkit-scrollbar { width: 0; }
        .tab-content { display: none; animation: slideUp 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        h2 { margin-bottom: 16px; font-size: 26px; font-weight: 800; }
        h2 span { background: linear-gradient(135deg, #fff, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .profile-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 20px; text-align: center; margin-bottom: 16px; }
        .avatar { width: 80px; height: 80px; background: linear-gradient(135deg, #6d28d9, #3b82f6); border-radius: 50%; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
        .xp-bar { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; margin: 12px 0; overflow: hidden; }
        .xp-fill { height: 100%; background: linear-gradient(90deg, #6d28d9, #3b82f6); transition: width 0.3s; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
        .stat-item { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 12px; font-size: 12px; }
        .stat-item b { display: block; font-size: 18px; color: #3b82f6; margin-top: 4px; }

        .filter-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 8px; scrollbar-width: none; }
        .filter-scroll::-webkit-scrollbar { display: none; }
        .filter-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; white-space: nowrap; cursor: pointer; }
        .filter-btn.active { color: #fff; background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }
        .filter-btn[data-r="common"].active { background: var(--c-common); border-color: var(--c-common); color:#000; }
        .filter-btn[data-r="rare"].active { background: var(--c-rare); border-color: var(--c-rare); }
        .filter-btn[data-r="epic"].active { background: var(--c-epic); border-color: var(--c-epic); }
        .filter-btn[data-r="mythic"].active { background: var(--c-mythic); border-color: var(--c-mythic); }
        .filter-btn[data-r="legendary"].active { background: var(--c-legendary); border-color: var(--c-legendary); color: #000; }
        .filter-btn[data-r="special"].active { background: linear-gradient(90deg, #ff00ff, #00ffff); border-color: transparent; color: #000; }

        .car-grid { display: grid; gap: 12px; }
        .car-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 16px; position: relative; transition: transform 0.2s; overflow: hidden; }
        .car-card:active { transform: scale(0.98); }
        .car-card.rarity-common { border-color: rgba(156,163,175,0.4); }
        .car-card.rarity-rare { border-color: rgba(59,130,246,0.6); box-shadow: inset 0 0 20px rgba(59,130,246,0.1); }
        .car-card.rarity-epic { border-color: rgba(168,85,247,0.6); box-shadow: inset 0 0 20px rgba(168,85,247,0.15); }
        .car-card.rarity-mythic { border-color: rgba(239,68,68,0.6); box-shadow: inset 0 0 20px rgba(239,68,68,0.15); }
        .car-card.rarity-legendary { border-color: rgba(251,191,36,0.6); box-shadow: inset 0 0 20px rgba(251,191,36,0.15); }
        .car-card.rarity-special { border: 2px solid transparent; background: linear-gradient(var(--card-bg), var(--card-bg)) padding-box, linear-gradient(45deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff) border-box; animation: rainbowGlow 3s linear infinite; }
        @keyframes rainbowGlow { 0% { box-shadow: 0 0 10px rgba(255,0,0,0.3); } 50% { box-shadow: 0 0 10px rgba(0,0,255,0.3); } 100% { box-shadow: 0 0 10px rgba(255,0,0,0.3); } }
        .car-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .car-badge { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; padding: 3px 8px; border-radius: 6px; color: #fff; }
        .rarity-common .car-badge { background: var(--c-common); color: #000; }
        .rarity-rare .car-badge { background: var(--c-rare); }
        .rarity-epic .car-badge { background: var(--c-epic); }
        .rarity-mythic .car-badge { background: var(--c-mythic); }
        .rarity-legendary .car-badge { background: var(--c-legendary); color: #000; }
        .rarity-special .car-badge { background: linear-gradient(90deg, #ff00ff, #00ffff); color: #000; }

        .car-image-container { height: 130px; width: 100%; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; position: relative; }
        .car-image { max-width: 92%; max-height: 100%; object-fit: contain; position: relative; z-index: 2; filter: drop-shadow(0 10px 8px rgba(0,0,0,0.6)); transition: filter 0.3s; }
        .car-placeholder { font-size: 60px; filter: drop-shadow(0 8px 8px rgba(0,0,0,0.5)); position: relative; z-index: 2; }
        .car-glow-under { position: absolute; bottom: 0; left: 5%; right: 5%; height: 34px; border-radius: 50%; filter: blur(16px); opacity: 0.95; z-index: 1; transition: background 0.3s; pointer-events: none; }
        .car-plate-mini { position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%); font-family: 'Arial Narrow', sans-serif; font-weight: 700; font-size: 8px; padding: 2px 4px; border-radius: 2px; border: 1px solid #000; white-space: nowrap; z-index: 3; }
        .car-plate-mini.ru { background: #fff; color: #000; border-left: 12px solid #0033aa; }
        .car-plate-mini.kz { background: #fff; color: #000; border-left: 12px solid #0072bc; }
        .car-plate-mini.by { background: #fff; color: #000; border-left: 12px solid #c8102e; }

        .car-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        .car-price { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
        .car-income { font-size: 12px; color: var(--success); font-weight: 600; margin-bottom: 10px; }
        .rarity-common .car-price { color: var(--c-common); }
        .rarity-rare .car-price { color: var(--c-rare); }
        .rarity-epic .car-price { color: var(--c-epic); }
        .rarity-mythic .car-price { color: var(--c-mythic); }
        .rarity-legendary .car-price { color: var(--c-legendary); }
        .rarity-special .car-price { background: linear-gradient(90deg, #ff00ff, #00ffff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-row { display: flex; gap: 8px; margin-top: 8px; }
        .btn-action { flex: 1; padding: 10px; border: none; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer; transition: opacity 0.2s; }
        .btn-action:active { opacity: 0.7; }
        .btn-buy { background: linear-gradient(135deg, #6d28d9, #3b82f6); color: #fff; }
        .btn-sell { background: rgba(239,68,68,0.2); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
        .btn-info { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--border); }
        .btn-custom { background: rgba(168,85,247,0.2); color: #c084fc; border: 1px solid rgba(168,85,247,0.3); }
        .car-owned-tag { display: inline-block; font-size: 12px; font-weight: 700; color: var(--success); background: rgba(0,255,136,0.1); padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(0,255,136,0.2); }

        .garage-stats { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px; margin-bottom: 16px; display: flex; justify-content: space-around; font-size: 12px; }
        .garage-stat { text-align: center; }
        .garage-stat b { display: block; font-size: 16px; color: #3b82f6; margin-top: 4px; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 100; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-content { background: #151522; border: 1px solid var(--border); border-radius: 24px; padding: 24px; width: 90%; max-width: 380px; animation: popIn 0.3s cubic-bezier(0.175,0.885,0.32,1.275); max-height: 85vh; overflow-y: auto; }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
        .modal-desc { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.4; }
        .modal-close { width: 100%; padding: 12px; margin-top: 20px; background: var(--card-bg); border: 1px solid var(--border); color: #fff; border-radius: 12px; font-weight: 700; cursor: pointer; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; }
        .stat-label { color: var(--text-muted); }
        .stat-value { font-weight: 700; }
        .stat-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-top: 4px; overflow: hidden; }
        .stat-bar-fill { height: 100%; background: linear-gradient(90deg, #6d28d9, #3b82f6); }

        .color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px; }
        .color-swatch { width: 100%; aspect-ratio: 1; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.2s; }
        .color-swatch:active { transform: scale(0.9); }
        .color-swatch.selected { border-color: #fff; box-shadow: 0 0 10px #fff; }
        .neon-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
        .neon-swatch { padding: 12px; border-radius: 12px; cursor: pointer; border: 2px solid transparent; font-size: 12px; font-weight: 700; text-align: center; }
        .neon-swatch.selected { border-color: #fff; box-shadow: 0 0 15px currentColor; }

        .task-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .task-info { display: flex; flex-direction: column; gap: 4px; }
        .task-title { font-weight: 700; font-size: 14px; }
        .task-progress { font-size: 12px; color: var(--text-muted); }
        .task-reward { font-size: 12px; color: var(--success); font-weight: 700; }
        .btn-claim { background: var(--success); color: #000; border: none; padding: 8px 16px; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer; }
        .btn-claim:disabled { background: rgba(255,255,255,0.1); color: var(--text-muted); cursor: not-allowed; }

        .ach-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
        .ach-icon { font-size: 32px; }
        .ach-info { flex: 1; }
        .ach-title { font-weight: 700; font-size: 14px; }
        .ach-desc { font-size: 11px; color: var(--text-muted); }
        .ach-status { font-size: 20px; }

        .tuning-select { width: 100%; padding: 14px; background: var(--card-bg); color: var(--text); border: 1px solid var(--border); border-radius: 14px; font-size: 15px; outline: none; font-weight: 600; margin-bottom: 12px; appearance: none; }
        .tuning-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .tuning-info { display: flex; flex-direction: column; gap: 4px; }
        .tuning-name { font-weight: 600; font-size: 14px; }
        .tuning-level { font-size: 11px; color: var(--text-muted); }
        .tuning-bar { width: 90px; height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-top: 6px; overflow: hidden; }
        .tuning-bar-fill { height: 100%; background: linear-gradient(90deg, #6d28d9, #3b82f6); transition: width 0.3s; }
        .btn-tune { background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.3); color: #60a5fa; padding: 8px 14px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; }
        .btn-tune:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
